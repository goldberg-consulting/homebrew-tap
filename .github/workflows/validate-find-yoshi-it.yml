name: Validate Find Yoshi IT
on:
  pull_request:
    paths:
      - 'Casks/find-yoshi-it.rb'
      - 'scripts/update-find-yoshi-it.py'
      - 'tests/**'
      - '.github/workflows/*find-yoshi-it.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests
      - name: Validate and install
        run: |
          brew tap --custom-remote goldberg-consulting/tap "$GITHUB_WORKSPACE"
          brew style --cask goldberg-consulting/tap/find-yoshi-it
          mkdir -p "$RUNNER_TEMP/apps"
          brew install --cask --appdir="$RUNNER_TEMP/apps" goldberg-consulting/tap/find-yoshi-it
          codesign --verify --deep --strict "$RUNNER_TEMP/apps/Find Yoshi IT.app"
